# Dependabot: weekly pull requests when an npm package has an update, and right away when
# one has a security advisory. The plugin ships no runtime dependencies; these are the
# type-checking tools (typescript, @types/node).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
    ignore:
      # Orca runs plugin workers on its own Node.js (24 as of Orca 1.4.272). Types for a newer
      # Node would accept APIs that crash there, so majors are raised by hand with Orca's Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-tools:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: ci
